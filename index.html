<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Discovery — Spotify + YouTube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── SETUP SCREEN ──────────────────────────────────────── -->
  <div id="setup-screen" class="screen hidden">
    <div class="setup-card">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="currentColor" width="40" height="40" style="color:#1DB954">
          <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
        </svg>
      </div>
      <h1>Music Discovery</h1>
      <p>Tell us what you love — we'll find fresh songs and play them through YouTube. Zero repeats.</p>

      <div class="setup-field">
        <label for="input-artists">Your Favourite Artists</label>
        <input id="input-artists" type="text"
          placeholder="e.g. The Weeknd, Drake, BTS, Taylor Swift"
          autocomplete="off" spellcheck="false">
        <small>Comma-separated · up to 10 artists · we'll discover songs based on them</small>
      </div>

      <div class="setup-field">
        <label for="input-yt-key">YouTube Data API Key</label>
        <input id="input-yt-key" type="text" placeholder="AIzaSy…" autocomplete="off" spellcheck="false">
        <small>Free key from <strong>console.cloud.google.com</strong> → YouTube Data API v3</small>
      </div>

      <button id="btn-save-keys" class="btn-primary">Start Discovering Music</button>
      <p id="setup-error" class="setup-error hidden"></p>
    </div>
  </div>

  <!-- login-screen kept as hidden placeholder (no longer used) -->
  <div id="login-screen" class="screen hidden"></div>

  <!-- ── MAIN PLAYER ────────────────────────────────────────── -->
  <div id="player-screen" class="screen hidden">

    <!-- Sidebar: upcoming queue -->
    <aside id="queue-sidebar">
      <h2>Up Next</h2>
      <ul id="queue-list">
        <li class="queue-placeholder">Loading recommendations…</li>
      </ul>
      <button id="btn-logout" class="btn-ghost">Disconnect</button>
    </aside>

    <!-- Main player area -->
    <main id="player-main">

      <!-- Album art + loading overlay -->
      <div id="album-art-wrap">
        <img id="album-art" src="" alt="Album Art" draggable="false">
        <div id="loading-overlay" class="hidden">
          <div class="spinner"></div>
        </div>
      </div>

      <!-- Track info -->
      <div id="track-info">
        <div id="song-title">—</div>
        <div id="song-artist">—</div>
      </div>

      <!-- Progress bar -->
      <div id="progress-wrap">
        <span id="time-current">0:00</span>
        <div id="progress-bar" role="slider" aria-label="Song progress" tabindex="0">
          <div id="progress-fill"></div>
        </div>
        <span id="time-total">0:00</span>
      </div>

      <!-- Controls -->
      <div id="controls">
        <button id="btn-prev" class="ctrl-btn ctrl-sm" aria-label="Previous song" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button id="btn-play" class="ctrl-btn ctrl-lg" aria-label="Play / Pause">
          <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="btn-skip" class="ctrl-btn ctrl-sm" aria-label="Skip song" title="Skip">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
        </button>
        <button id="btn-never" class="ctrl-btn ctrl-sm ctrl-danger" aria-label="Never suggest this song again" title="Never suggest again">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H7v-2h10v2z"/></svg>
        </button>
      </div>

    </main>

  </div>

  <!-- Toast container (injected by player.js) -->
  <div id="toast-container"></div>

  <!-- Hidden YouTube IFrame player (0×0, driven by JS) -->
  <div id="yt-player"></div>

  <!-- YouTube IFrame API — must load before app.js uses YT global -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <!-- App entry point (imports all other modules) -->
  <script type="module" src="app.js"></script>

</body>
</html>
